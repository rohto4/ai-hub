name: hourly-enrich-paper

on:
  schedule:
    - cron: '45 * * * *'   # 毎時 :45 に paper を別枠処理
  workflow_dispatch:

jobs:
  hourly-enrich-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Layer 2 enrich worker for paper
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/enrich-worker?queueType=paper&limit=20&summaryBatchSize=20&maxSummaryBatches=1"
